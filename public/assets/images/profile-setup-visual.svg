<svg xmlns="http://www.w3.org/2000/svg" width="360" height="850" viewBox="0 0 360 850" role="img" aria-labelledby="title desc">
  <title id="title">WORKTRACK profile setup visual</title>
  <desc id="desc">A soft green workspace illustration with a plant, book, calendar, and clock.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1dc"/>
      <stop offset="0.55" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#ece7c9"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
